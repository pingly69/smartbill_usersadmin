<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>SmartBill Approve v2.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <div id="loading" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        <p class="text-gray-500 font-medium animate-pulse">กำลังดึงข้อมูลล่าสุด...</p>
    </div>

    <!-- Unauthorized Screen -->
    <div id="unauth-screen" class="hidden p-6">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 mt-10 border border-gray-100 text-center">
            <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                    </path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-gray-800">ไม่มีสิทธิ์เข้าใช้งาน</h2>
            <p id="unauth-message" class="text-gray-500 text-sm mb-6">คุณไม่มีสิทธิ์เข้าใช้งานระบบนี้ (สำหรับผู้ถือวงเงินสดย่อยเท่านั้น)</p>
        </div>
    </div>

    <!-- 0. Registration Screen -->
    <div id="reg-screen" class="hidden p-6">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 mt-10 border border-gray-100 text-center">
            <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                    </path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-indigo-700">ลงทะเบียนผู้อนุมัติ</h2>
            <p class="text-gray-500 text-sm mb-6">ระบุรหัสผ่านส่วนตัวเพื่อเริ่มการอนุมัติ</p>
            <div class="space-y-4">
                <input type="password" id="reg-pass" placeholder="กรอกรหัสผ่านของคุณ"
                    class="w-full px-4 py-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center text-lg">
                <button onclick="register()"
                    class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition transform active:scale-95 shadow-lg">
                    ยืนยันตัวตน
                </button>
            </div>
        </div>
    </div>

    <!-- 1. List Screen -->
    <div id="list-screen" class="hidden pb-40">
        <header class="bg-white border-b sticky top-0 z-20 px-4 py-4 flex justify-between items-center shadow-sm">
            <div>
                <h1 class="font-black text-xl text-indigo-900">SmartBill Approve v2.6</h1>
                <p id="user-info" class="text-[10px] text-gray-400 font-medium uppercase tracking-wider"></p>
            </div>
            <button onclick="loadData()"
                class="bg-gray-100 p-2.5 rounded-full text-gray-600 active:bg-indigo-100 active:text-indigo-600 transition">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                    </path>
                </svg>
            </button>
        </header>

        <div id="data-container" class="p-4 space-y-5 max-w-2xl mx-auto">
            <!-- Cards will be injected here -->
        </div>

        <div id="no-data" class="hidden text-center py-24 px-6">
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-800">จัดการเรียบร้อยแล้ว!</h3>
            <p class="text-gray-500 mt-2">ไม่มีรายการที่ต้องจ่ายเงินในขณะนี้</p>
        </div>

        <!-- Floating Action Bar -->
        <div id="action-bar"
            class="fixed bottom-6 left-4 right-4 z-30 max-w-lg mx-auto bg-white/90 backdrop-blur-md border border-white/20 p-4 rounded-2xl shadow-2xl flex gap-3">
            <button onclick="processApprove('Rejected')"
                class="flex-1 bg-white border-2 border-red-500 text-red-600 font-bold py-4 rounded-xl active:bg-red-50 transition active:scale-95 uppercase tracking-wide">
                Reject
            </button>
            <button onclick="processApprove('Paided')"
                class="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 active:bg-indigo-700 transition active:scale-95 uppercase tracking-wide">
                Paid
            </button>
        </div>
    </div>

    <script src="./js/config.js?v=2.6.4"></script>
    <script src="./js/app.js?v=2.6.4"></script>
</body>

</html>
